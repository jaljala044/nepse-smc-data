name: P4.34 official NEPSE historical floorsheet API probe
on:
  push:
    branches:
      - p434-official-historical-floorsheet-api-probe
    paths:
      - "tools/probe_p434_official_floorsheet_api.py"
      - "tools/tests/test_probe_p434_official_floorsheet_api.py"
      - ".github/workflows/p434-official-floorsheet-api-probe.yml"
  pull_request:
    paths:
      - "tools/probe_p434_official_floorsheet_api.py"
      - "tools/tests/test_probe_p434_official_floorsheet_api.py"
      - ".github/workflows/p434-official-floorsheet-api-probe.yml"
permissions:
  contents: write
concurrency:
  group: p434-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run P4.34 probe tests
        run: |
          cd tools
          python -m unittest discover -s tests -p 'test_probe_p434_official_floorsheet_api.py' -v
      - name: Probe official NEPSE API without bypassing authentication
        run: python tools/probe_p434_official_floorsheet_api.py
      - name: Commit redacted probe report and public response payloads
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/p434_official_api_probe
          if ! git diff --cached --quiet; then
            git commit -m "evidence(p4.34): record official NEPSE floorsheet API probe"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
