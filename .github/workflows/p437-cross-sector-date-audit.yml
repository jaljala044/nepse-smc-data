name: P4.37 cross-sector canonical date audit
on:
  push:
    branches:
      - p437-closed-date-contamination-audit
    paths:
      - "tools/capture_p437_cross_sector_date_audit.py"
      - "tools/tests/test_capture_p437_cross_sector_date_audit.py"
      - ".github/workflows/p437-cross-sector-date-audit.yml"
      - "scanner_inputs/sectors.csv"
      - "03_stock_charts_ohlcv/**"
  pull_request:
    paths:
      - "tools/capture_p437_cross_sector_date_audit.py"
      - "tools/tests/test_capture_p437_cross_sector_date_audit.py"
      - ".github/workflows/p437-cross-sector-date-audit.yml"
      - "scanner_inputs/sectors.csv"
      - "03_stock_charts_ohlcv/**"
permissions:
  contents: write
concurrency:
  group: p437-cross-sector-date-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned WASM runtime
        run: python -m pip install pywasm==2.0.0
      - name: Run P4.37 regression tests
        run: |
          cd tools
          python -m unittest discover -s tests -p 'test_capture_p437_cross_sector_date_audit.py' -v
      - name: Capture stratified official EOD sample
        if: github.event_name == 'push'
        run: python tools/capture_p437_cross_sector_date_audit.py
      - name: Commit immutable official response pages and audit report
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/p437_cross_sector_date_contamination_audit
          if ! git diff --cached --quiet; then
            git commit -m "evidence(p4.37): capture cross-sector NEPSE EOD date audit"
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
            git push
          fi
