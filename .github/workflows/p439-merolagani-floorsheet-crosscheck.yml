name: P4.39 Merolagani historical floorsheet cross-check
on:
  push:
    branches:
      - p439-merolagani-datewise-floorsheet-crosscheck
    paths:
      - "tools/capture_p439_merolagani_floorsheets.py"
      - "tools/tests/test_capture_p439_merolagani_floorsheets.py"
      - ".github/workflows/p439-merolagani-floorsheet-crosscheck.yml"
  pull_request:
    paths:
      - "tools/capture_p439_merolagani_floorsheets.py"
      - "tools/tests/test_capture_p439_merolagani_floorsheets.py"
      - ".github/workflows/p439-merolagani-floorsheet-crosscheck.yml"
permissions:
  contents: write
concurrency:
  group: p439-merolagani-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned scraper dependencies
        run: python -m pip install "httpx[http2]==0.27.2" "beautifulsoup4==4.12.3"
      - name: Run P4.39 parser and completeness tests
        run: |
          cd tools
          python -m unittest discover -s tests -p 'test_capture_p439_merolagani_floorsheets.py' -v
      - name: Capture four complete Merolagani market floorsheets
        if: github.event_name == 'push'
        run: python tools/capture_p439_merolagani_floorsheets.py
      - name: Commit raw pages and datewise audit report
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/p439_merolagani_floorsheets
          if ! git diff --cached --quiet; then
            git commit -m "evidence(p4.39): preserve Merolagani datewise floorsheets"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
