name: P443 publication gate
on:
  push:
    paths:
      - 'scanner_inputs/canonical_publication.py'
      - 'scanner_inputs/session_totals.py'
      - 'scanner_inputs/equity_exception_holds.py'
      - 'reference/*_ohlc_exception_register_2026-11-26.csv'
      - 'scanner_inputs/retrieve_quarantine_overlay.py'
      - 'scanner_inputs/retrieve_drive_quarantine.py'
      - 'test_p443_drive_quarantine.py'
      - 'github_floorsheet_pull.py'
      - 'test_p443_canonical_publication.py'
      - '.github/workflows/p443-publication-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-auth requests
      - run: python -m unittest test_p443_canonical_publication test_p443_historical_quarantine test_p443_scanner_quarantine test_p443_drive_quarantine -v
      - run: python -m py_compile github_floorsheet_pull.py
      - name: Verify actual private Drive quarantine overlay
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$GDRIVE_SERVICE_ACCOUNT_JSON" || { echo "Missing GDRIVE_SERVICE_ACCOUNT_JSON secret; fail closed"; exit 1; }
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gdrive-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gdrive-service-account.json"
          python -m scanner_inputs.retrieve_drive_quarantine "$RUNNER_TEMP/p443-overlay.csv"
