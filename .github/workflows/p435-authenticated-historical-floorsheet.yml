name: P4.35 authenticated NEPSE historical floorsheet probe
on:
  push:
    branches:
      - p435-nepse-salter-authenticated-historical-floorsheet
    paths:
      - "tools/capture_p435_authenticated_historical_floorsheets.py"
      - "tools/tests/test_capture_p435_authenticated_historical_floorsheets.py"
      - ".github/workflows/p435-authenticated-historical-floorsheet.yml"
  pull_request:
    paths:
      - "tools/capture_p435_authenticated_historical_floorsheets.py"
      - "tools/tests/test_capture_p435_authenticated_historical_floorsheets.py"
      - ".github/workflows/p435-authenticated-historical-floorsheet.yml"
permissions:
  contents: write
concurrency:
  group: p435-nepse-auth-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned WASM runtime
        run: python -m pip install pywasm==2.0.0
      - name: Run P4.35 authentication and evidence tests
        run: |
          cd tools
          python -m unittest discover -s tests -p 'test_capture_p435_authenticated_historical_floorsheets.py' -v
      - name: Capture authenticated historical floorsheets
        if: github.event_name == 'push'
        run: python tools/capture_p435_authenticated_historical_floorsheets.py
      - name: Commit redacted official response pages
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/p435_official_historical_floorsheets
          if ! git diff --cached --quiet; then
            git commit -m "evidence(p4.35): capture authenticated NEPSE historical floorsheets"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
