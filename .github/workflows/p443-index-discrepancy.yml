name: P443 index discrepancy audit
on:
  push:
    branches: [p443-global-integrity-audit]
    paths:
      - '.github/workflows/p443-index-discrepancy.yml'
      - 'tools/p443_index_discrepancy_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/p443_index_discrepancy_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: index-discrepancy-audit
          path: index-discrepancy-audit.json
