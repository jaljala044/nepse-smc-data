name: NEPSE reference-data validation tests

on:
  push:
    paths:
      - "nepse_reference_validation.py"
      - "test_nepse_reference_validation.py"
      - "nepse_session_date.py"
      - "test_nepse_session_date.py"
      - "test_user_finalized_ohlcv.py"
      - "03_stock_charts_ohlcv/API_OHLCV.csv"
      - "03_stock_charts_ohlcv/BGWT_OHLCV.csv"
      - "03_stock_charts_ohlcv/HRL_OHLCV.csv"
      - "03_stock_charts_ohlcv/MEHL_OHLCV.csv"
      - "03_stock_charts_ohlcv/RAWA_OHLCV.csv"
      - "03_stock_charts_ohlcv/RHGCL_OHLCV.csv"
      - "03_stock_charts_ohlcv/ULHC_OHLCV.csv"
      - ".github/workflows/nepse-reference-validation.yml"
  pull_request:
    paths:
      - "nepse_reference_validation.py"
      - "test_nepse_reference_validation.py"
      - "nepse_session_date.py"
      - "test_nepse_session_date.py"
      - "test_user_finalized_ohlcv.py"
      - "03_stock_charts_ohlcv/API_OHLCV.csv"
      - "03_stock_charts_ohlcv/BGWT_OHLCV.csv"
      - "03_stock_charts_ohlcv/HRL_OHLCV.csv"
      - "03_stock_charts_ohlcv/MEHL_OHLCV.csv"
      - "03_stock_charts_ohlcv/RAWA_OHLCV.csv"
      - "03_stock_charts_ohlcv/RHGCL_OHLCV.csv"
      - "03_stock_charts_ohlcv/ULHC_OHLCV.csv"
      - ".github/workflows/nepse-reference-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-data-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run NEPSE reference-data tests
        run: python -m unittest test_nepse_reference_validation test_nepse_session_date test_user_finalized_ohlcv -v
