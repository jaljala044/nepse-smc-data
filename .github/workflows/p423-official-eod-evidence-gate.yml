name: P4.23 Official NEPSE EOD evidence gate
on:
  pull_request:
    paths:
      - 'tools/validate_nepse_eod_capture.py'
      - 'tools/tests/test_validate_nepse_eod_capture.py'
      - '.github/workflows/p423-official-eod-evidence-gate.yml'
  push:
    paths:
      - 'tools/validate_nepse_eod_capture.py'
      - 'tools/tests/test_validate_nepse_eod_capture.py'
      - '.github/workflows/p423-official-eod-evidence-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run official EOD evidence gate tests
        run: python -m unittest discover -s tools/tests -p 'test_validate_nepse_eod_capture.py' -v
