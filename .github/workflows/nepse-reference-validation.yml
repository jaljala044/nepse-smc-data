name: NEPSE reference-data validation tests

on:
  push:
    paths:
      - "nepse_reference_validation.py"
      - "test_nepse_reference_validation.py"
      - "nepse_session_date.py"
      - "test_nepse_session_date.py"
      - ".github/workflows/nepse-reference-validation.yml"
  pull_request:
    paths:
      - "nepse_reference_validation.py"
      - "test_nepse_reference_validation.py"
      - "nepse_session_date.py"
      - "test_nepse_session_date.py"
      - ".github/workflows/nepse-reference-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-data-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run NEPSE reference-data tests
        run: python -m unittest test_nepse_reference_validation test_nepse_session_date -v
