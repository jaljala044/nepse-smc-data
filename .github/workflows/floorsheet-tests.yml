name: Floorsheet collector tests

on:
  pull_request:
    paths:
      - "github_floorsheet_pull.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/floorsheet-tests.yml"
  push:
    branches:
      - main
    paths:
      - "github_floorsheet_pull.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/floorsheet-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          playwright install chromium
      - name: Compile collector
        run: python -m py_compile github_floorsheet_pull.py
      - name: Run unit tests
        run: pytest -q
