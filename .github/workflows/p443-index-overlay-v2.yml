name: P443 index overlay V2
on:
  push:
    branches: [p443-global-integrity-audit]
    paths:
      - '.github/workflows/p443-index-overlay-v2.yml'
      - 'tools/p443_index_overlay_v2.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/p443_index_correction_overlay.py
      - run: python tools/p443_sector_external_recovery.py
      - run: python tools/p443_index_overlay_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: index-overlay-v2
          path: |
            index-overlay-v2.json
            index-quarantine-v2.json
