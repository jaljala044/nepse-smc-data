name: Floorsheet reconciliation tests

on:
  pull_request:
    paths:
      - 'tools/reconcile_floorsheet_ohlcv.py'
      - 'reference/floorsheet_reconciliation_manifest_2026-11-20.csv'
      - 'reference/nepse_canonical_session_calendar_2025-2026.csv'
      - 'reference/p410_stage1_coverage_matrix_2026-11-26.csv'
      - 'reference/p416_2026-11-20_281_equity_reconciliation_contract_2026-11-26.md'
      - 'tools/tests/test_reconcile_floorsheet_ohlcv.py'
      - 'tools/audit_observed_session_gaps.py'
      - 'tools/tests/test_audit_observed_session_gaps.py'
      - 'reference/p417_281_equity_observed_session_archive_gap_audit_2026-11-26.md'
      - 'tools/reconcile_nov20_independent_floorsheet.py'
      - '02_floorsheet_daily/floorsheet_2026-11-20.csv'
      - '.github/workflows/floorsheet-reconciliation-tests.yml'
  push:
    paths:
      - 'tools/reconcile_floorsheet_ohlcv.py'
      - 'tools/tests/test_reconcile_floorsheet_ohlcv.py'
      - 'tools/reconcile_nov20_independent_floorsheet.py'
      - '02_floorsheet_daily/floorsheet_2026-11-20.csv'
      - '.github/workflows/floorsheet-reconciliation-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run evidence-gate regression tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v



  observational-281-equity-archive-gap-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jaljala044/nepse-history-starter
          path: starter
          persist-credentials: false
      - name: Build 281-equity observed-date archive gap report
        run: |
          mkdir -p audit-output
          python3 tools/audit_observed_session_gaps.py \
            --universe reference/p410_stage1_coverage_matrix_2026-11-26.csv \
            --calendar reference/nepse_canonical_session_calendar_2025-2026.csv \
            --ohlcv-dir starter/03_stock_charts_ohlcv \
            --expected-symbol-count 281 \
            --output audit-output/281_equity_observed_session_archive_gaps.csv \
            --detail-output audit-output/281_equity_observed_session_archive_gap_dates.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 281-equity-observed-session-archive-gap-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 30

  equity-universe-session-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jaljala044/nepse-history-starter
          path: starter
          persist-credentials: false
      - name: Download pinned 2026-11-20 full-session candidate
        run: |
          mkdir -p audit-input audit-output
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/socrateai-official/nepse-open-data/main/floorsheet/floorsheet_2026-11-20.csv" \
            --output audit-input/floorsheet_2026-11-20.csv
          echo "abafc3b8eaa8d2b9b884e9f2df974deb267485d4476f2a4e953d6324787fc43d  audit-input/floorsheet_2026-11-20.csv" | sha256sum --check
      - name: Reconcile the 281-equity universe
        run: |
          python3 tools/reconcile_floorsheet_ohlcv.py \
            --floorsheet-dir audit-input \
            --ohlcv-dir starter/03_stock_charts_ohlcv \
            --calendar reference/nepse_canonical_session_calendar_2025-2026.csv \
            --manifest reference/floorsheet_reconciliation_manifest_2026-11-20.csv \
            --symbol-universe-csv reference/p410_stage1_coverage_matrix_2026-11-26.csv \
            --expected-symbol-count 281 \
            --output audit-output/2026-11-20_equity_trade_status.csv
      - name: Print symbol-level reconciliation disposition
        run: |
          python3 - <<'PY'
          import csv
          import json
          from collections import defaultdict
          grouped = defaultdict(list)
          with open("audit-output/2026-11-20_equity_trade_status.csv", newline="", encoding="utf-8") as handle:
              for row in csv.DictReader(handle):
                  grouped[row["trade_status"]].append(row["symbol"])
          print(json.dumps({key: sorted(value) for key, value in sorted(grouped.items())}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2026-11-20-281-equity-session-reconciliation
          path: audit-output/
          if-no-files-found: error
          retention-days: 30

  recent-session-parity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        date: ['2026-11-19', '2026-11-20', '2026-11-24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: Download independent pipeline partition
        env:
          AUDIT_DATE: ${{ matrix.date }}
        run: |
          mkdir -p "audit-input/$AUDIT_DATE" "audit-output/$AUDIT_DATE"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://huggingface.co/datasets/AnkitSanjyal/nepse-market-data/resolve/main/floorsheet/business_date=$AUDIT_DATE/part-0.parquet" \
            --output "audit-input/$AUDIT_DATE/pipeline.parquet"
      - name: Download SocrateAI full-session candidate
        env:
          AUDIT_DATE: ${{ matrix.date }}
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/socrateai-official/nepse-open-data/main/floorsheet/floorsheet_$AUDIT_DATE.csv" \
            --output "audit-input/$AUDIT_DATE/socrateai.csv"
      - name: Compare normalized trade multisets
        env:
          AUDIT_DATE: ${{ matrix.date }}
        run: |
          args=(--date "$AUDIT_DATE" \
            --parquet "audit-input/$AUDIT_DATE/pipeline.parquet" \
            --candidate "audit-input/$AUDIT_DATE/socrateai.csv" \
            --out "audit-output/$AUDIT_DATE/cross_source_reconciliation.json")
          if [[ "$AUDIT_DATE" == "2026-11-20" ]]; then
            args+=(--local "02_floorsheet_daily/floorsheet_2026-11-20.csv")
          fi
          python tools/reconcile_nov20_independent_floorsheet.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floorsheet-${{ matrix.date }}-cross-source-audit
          path: audit-output/${{ matrix.date }}/
          if-no-files-found: warn
          retention-days: 30
