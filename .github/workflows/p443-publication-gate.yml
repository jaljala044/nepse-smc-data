name: P443 publication gate
on:
  push:
    paths:
      - 'scanner_inputs/canonical_publication.py'
      - 'scanner_inputs/session_totals.py'
      - 'scanner_inputs/equity_exception_holds.py'
      - 'reference/*_ohlc_exception_register_2026-11-26.csv'
      - 'scanner_inputs/retrieve_quarantine_overlay.py'
      - 'github_floorsheet_pull.py'
      - 'test_p443_canonical_publication.py'
      - '.github/workflows/p443-publication-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_p443_canonical_publication test_p443_historical_quarantine test_p443_scanner_quarantine -v
      - run: python -m py_compile github_floorsheet_pull.py
      - name: Verify actual pinned historical quarantine artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15155667000/zip" > "$RUNNER_TEMP/p443-overlay.zip"
          python -m scanner_inputs.retrieve_quarantine_overlay "$RUNNER_TEMP/p443-overlay.zip" "$RUNNER_TEMP/p443-overlay.csv"
          python -c 'import sys; from scanner_inputs.historical_quarantine import load_holds; h=load_holds(sys.argv[1]); print("Verified keys:", len(h), "Affected dates:", len({k[1] for k in h}))' "$RUNNER_TEMP/p443-overlay.csv"
