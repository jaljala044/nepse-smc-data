name: P4.36 official NEPSE historical price-volume cross-check
on:
  push:
    branches:
      - p436-official-historical-price-volume-crosscheck
    paths:
      - "tools/capture_p436_official_historical_price_volume.py"
      - "tools/tests/test_capture_p436_official_historical_price_volume.py"
      - ".github/workflows/p436-official-historical-price-volume.yml"
  pull_request:
    paths:
      - "tools/capture_p436_official_historical_price_volume.py"
      - "tools/tests/test_capture_p436_official_historical_price_volume.py"
      - ".github/workflows/p436-official-historical-price-volume.yml"
permissions:
  contents: write
concurrency:
  group: p436-price-volume-${{ github.ref }}
  cancel-in-progress: false
jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned WASM runtime
        run: python -m pip install pywasm==2.0.0
      - name: Run P4.36 regression tests
        run: |
          cd tools
          python -m unittest discover -s tests -p 'test_capture_p436_official_historical_price_volume.py' -v
      - name: Query official historical price-volume endpoint
        if: github.event_name == 'push'
        run: python tools/capture_p436_official_historical_price_volume.py
      - name: Commit redacted official EOD responses
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/p436_official_price_volume
          if ! git diff --cached --quiet; then
            git commit -m "evidence(p4.36): capture official historical price-volume responses"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
