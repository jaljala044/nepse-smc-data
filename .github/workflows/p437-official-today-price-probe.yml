name: P4.37 official NEPSE today-price historical-date probe
on:
  push:
    branches:
      - p437-official-today-price-historical-date-probe
    paths:
      - "tools/capture_nepse_official_eod.py"
      - "tools/p437_official_eod_helpers.py"
      - "tools/capture_p437_official_today_price_batch.py"
      - "tools/tests/test_p437_official_eod_helpers.py"
      - "tools/tests/test_capture_p437_official_today_price_batch.py"
      - ".github/workflows/p437-official-today-price-probe.yml"
  pull_request:
    paths:
      - "tools/capture_nepse_official_eod.py"
      - "tools/p437_official_eod_helpers.py"
      - "tools/capture_p437_official_today_price_batch.py"
      - "tools/tests/test_p437_official_eod_helpers.py"
      - "tools/tests/test_capture_p437_official_today_price_batch.py"
      - ".github/workflows/p437-official-today-price-probe.yml"
permissions:
  contents: write
concurrency:
  group: p437-today-price-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kathmandu
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned NEPSE API client
        run: python -m pip install "httpx>=0.27,<1" "nepse @ git+https://github.com/basic-bgnr/NepseUnofficialApi.git@180a550c60f1959983b854659e650a4c189a3c0f"
      - name: Run P4.37 summary and batch tests
        run: |
          cd tools
          python -m unittest discover -s tests -p 'test_p437_official_eod_helpers.py' -v
          python -m unittest discover -s tests -p 'test_capture_p437_official_today_price_batch.py' -v
      - name: Compile official EOD capture code
        run: python -m py_compile tools/capture_nepse_official_eod.py tools/p437_official_eod_helpers.py tools/capture_p437_official_today_price_batch.py
      - name: Capture all four exact business dates
        if: github.event_name == 'push'
        run: python tools/capture_p437_official_today_price_batch.py
      - name: Commit raw official EOD pages and batch report
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/p437_official_today_price
          if ! git diff --cached --quiet; then
            git commit -m "evidence(p4.37): capture official today-price historical-date probes"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
