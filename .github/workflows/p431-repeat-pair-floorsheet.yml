name: P4.31 official NEPSE floorsheet repeat-pair audit
on:
  push:
    branches:
      - derived/ohlcv-v2-official-eod
  pull_request:
    paths:
      - 'tools/capture_nepse_repeat_pair_floorsheets.py'
      - 'tools/tests/test_capture_nepse_repeat_pair_floorsheets.py'
      - '.github/workflows/p431-repeat-pair-floorsheet.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/checkout@v4
        with:
          repository: jaljala044/nepse-smc-data
          ref: main
          path: evidence/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NEPSE official API client
        run: python -m pip install "httpx>=0.27" "nepse @ git+https://github.com/basic-bgnr/NepseUnofficialApi.git"
      - name: Run capture regression tests
        run: python -m unittest discover -s tools/tests -p 'test_capture_nepse_repeat_pair_floorsheets.py' -v
      - name: Capture full company floorsheets for five repeat pairs
        run: |
          python tools/capture_nepse_repeat_pair_floorsheets.py \
            --repeat-flags derived/ohlcv_v2/quality_audit/adjacent_repeat_flags.csv \
            --mapping evidence/main/reference/nepse_security_id_snapshot_2026-11-25.csv \
            --output-dir evidence/nepse-repeat-floorsheets
      - name: Upload original official floorsheet payloads and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p431-official-nepse-repeat-pair-floorsheets
          path: evidence/nepse-repeat-floorsheets/
          if-no-files-found: warn
          retention-days: 90
