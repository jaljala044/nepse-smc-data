name: P4.36 official historical EOD cross-check
on:
  push:
    branches:
      - p436-official-eod-history-crosscheck
    paths:
      - "tools/capture_p436_official_eod_history.py"
      - "tools/tests/test_capture_p436_official_eod_history.py"
      - ".github/workflows/p436-official-eod-history.yml"
  pull_request:
    paths:
      - "tools/capture_p436_official_eod_history.py"
      - "tools/tests/test_capture_p436_official_eod_history.py"
      - ".github/workflows/p436-official-eod-history.yml"
permissions:
  contents: write
concurrency:
  group: p436-nepse-eod-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned WASM runtime
        run: python -m pip install pywasm==2.0.0
      - name: Run P4.36 EOD evidence tests
        run: |
          cd tools
          python -m unittest discover -s tests -p 'test_capture_p436_official_eod_history.py' -v
      - name: Capture official historical EOD responses
        if: github.event_name == 'push'
        run: python tools/capture_p436_official_eod_history.py
      - name: Commit redacted official EOD response pages
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/p436_official_eod_history
          if ! git diff --cached --quiet; then
            git commit -m "evidence(p4.36): capture official NEPSE historical EOD records"
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
            git push
          fi
