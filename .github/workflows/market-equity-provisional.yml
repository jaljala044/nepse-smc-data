name: Market equity provisional build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/market-equity-provisional.yml'
      - 'tools/build_market_equity_provisional.py'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: srijankarki07/nepse-data
          ref: 688d59c03915dcee73ecad4230d2083a41c61764
          path: external-source
          persist-credentials: false
          sparse-checkout: data/series
      - name: Recompute evidence
        run: python3 tools/reconcile_equity_external_archive.py --root . --external external-source --output reconciliation-output
      - name: Generate provisional dataset
        run: python3 tools/build_market_equity_provisional.py --root . --external external-source --evidence reconciliation-output --output market-derived
      - uses: actions/upload-artifact@v4
        with:
          name: market-equity-provisional
          path: market-derived/
