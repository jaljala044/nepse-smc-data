name: P4.30 recent OHLCV anomaly official reconciliation
on:
  push:
    branches:
      - p430-reconcile-recent-ohlcv-anomalies
  pull_request:
    paths:
      - 'tools/build_p430_recent_anomaly_queue.py'
      - 'tools/tests/test_build_p430_recent_anomaly_queue.py'
      - '.github/workflows/p430-recent-ohclv-anomaly-audit.yml'
permissions:
  contents: write
  actions: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: jaljala044/nepse-smc-data
          ref: main
          path: evidence/main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official NEPSE API client
        run: python -m pip install "httpx>=0.27" "nepse @ git+https://github.com/basic-bgnr/NepseUnofficialApi.git"
      - name: Test recent anomaly queue
        run: python -m unittest discover -s tools/tests -p 'test_build_p430_recent_anomaly_queue.py' -v
      - name: Build 11-row recent anomaly queue
        run: |
          python tools/build_p430_recent_anomaly_queue.py \
            --v2-dir derived/ohlcv_v2 \
            --flags derived/ohlcv_v2/quality_audit/ohlcv_invariant_flags.csv \
            --mapping evidence/main/reference/nepse_security_id_snapshot_2026-11-25.csv \
            --output evidence/p430_recent_anomaly_queue.csv
      - name: Capture complete official NEPSE EOD boards
        run: |
          set -euo pipefail
          for d in 2026-04-24 2026-04-27 2026-04-28 2026-04-29; do
            python evidence/main/tools/capture_nepse_official_eod_board.py \
              --date "$d" \
              --output-dir "evidence/nepse-official-p430/$d"
          done
      - name: Reconcile recent anomalies to official EOD
        run: |
          PYTHONPATH=evidence/main/tools python tools/audit_p430_recent_official_eod.py \
            --queue evidence/p430_recent_anomaly_queue.csv \
            --mapping evidence/main/reference/nepse_security_id_snapshot_2026-11-25.csv \
            --capture-dir evidence/nepse-official-p430 \
            --output reference/p430_11_recent_anomaly_official_reconciliation_2026-11-26.csv \
            --expected-count 11
      - name: Verify complete and accepted official coverage
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          rows = list(csv.DictReader(Path("reference/p430_11_recent_anomaly_official_reconciliation_2026-11-26.csv").open()))
          assert len(rows) == 11, len(rows)
          assert all(r["official_capture_status"] == "OFFICIAL_CAPTURE_ACCEPTED" for r in rows)
          assert all(r["official_security_id"] == r["mapping_security_id"] for r in rows)
          assert all(r["official_row_count"] == "1" for r in rows)
          print({"rows": len(rows), "official_statuses": sorted({r["official_capture_status"] for r in rows}), "tuple_matches": sum(r["official_ohlcv_match"] == "TRUE" for r in rows), "tuple_differences": sum(r["official_ohlcv_match"] == "FALSE" for r in rows)})
          PY
      - name: Commit reconciliation evidence
        if: github.event_name == 'push' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/p430_11_recent_anomaly_official_reconciliation_2026-11-26.csv
          if ! git diff --cached --quiet; then
            git commit -m "data(p4.30): reconcile recent OHLCV anomalies to official EOD"
            git push
          fi
      - name: Upload official board payloads and queue
        uses: actions/upload-artifact@v4
        with:
          name: p430-official-eod-recent-anomalies
          path: |
            evidence/nepse-official-p430/
            evidence/p430_recent_anomaly_queue.csv
          retention-days: 90
