name: P443 sector external recovery
on:
  push:
    branches: [p443-global-integrity-audit]
    paths:
      - '.github/workflows/p443-sector-external-recovery.yml'
      - 'tools/p443_sector_external_recovery.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/p443_sector_external_recovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: sector-external-recovery
          path: sector-external-recovery.json
