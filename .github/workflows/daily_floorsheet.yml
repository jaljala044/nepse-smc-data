name: Daily NEPSE Floorsheet Pull

on:
  schedule:
    - cron: "15 11 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  pull-floorsheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Retrieve and verify pinned quarantine overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/15155667000/zip > "$RUNNER_TEMP/p443-overlay.zip"
          python -m scanner_inputs.retrieve_quarantine_overlay "$RUNNER_TEMP/p443-overlay.zip" "$RUNNER_TEMP/p443-overlay.csv"
      - name: Pull Data
        run: python github_floorsheet_pull.py --quarantine-overlay "$RUNNER_TEMP/p443-overlay.csv" --session-controls reference/session_controls

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add floorsheet/
          if ! git diff --staged --quiet; then
            git commit -m "Update daily floorsheet CSV"
            git push
          else
            echo "No changes to commit."
          fi
