      - "test_p443_content_audit.py"
      - "test_p443_scanner_quarantine.py"
      - "test_p443_cross_repository.py"
      - "scanner_inputs/prepare_scanner_inputs.py"
      - "test_global_duplicate_audit_inventory.py"
      - "test_global_duplicate_audit_scan.py"
      - ".github/workflows/p443-global-integrity-audit.yml"
  pull_request:
    paths:
      - "reference/NEPSE_GLOBAL_DUPLICATE_AUDIT_INVENTORY.csv"
      - "reference/NEPSE_GLOBAL_DUPLICATE_AUDIT_REPORT.md"
      - "reference/NEPSE_GLOBAL_DUPLICATE_AUDIT_FINDINGS.csv"
      - "reference/NEPSE_GLOBAL_DUPLICATE_AUDIT_SCAN_SUMMARY.csv"
      - "tools/audit_global_data_integrity.py"
      - "tools/p443_join_ohlcv_exceptions.py"
      - "tools/p443_classify_repeated_candles.py"
      - "tools/p443_export_repeat_review_queues.py"
      - "tools/p443_recorded_closure_row_hold.py"
      - "tools/p443_reconcile_historical_holidays.py"
      - "tools/p443_verify_open_pairs.py"
      - "tools/p443_equity_first_repeat_review.py"
      - "tools/p443_equity_security_date_queue.py"
      - "tools/p443_bulk_equity_floorsheet_recovery.py"
      - "tools/p443_observed_open_close.py"
      - "test_p443_observed_open_close.py"
      - "tools/p443_secondary_bulk_coverage.py"
      - "tools/p443_secondary_bulk_recovery.py"
      - "test_p443_secondary_bulk_recovery.py"
      - "tools/p443_hf_bulk_equity_floorsheet_recovery.py"
      - "tools/p443_hf_20240801_rate_precision.py"
      - "test_p443_bulk_equity_floorsheet_recovery.py"
      - "test_p443_hf_bulk_equity_floorsheet_recovery.py"
      - "test_p443_hf_20240801_rate_precision.py"
      - "test_p443_equity_security_date_queue.py"
      - "test_p443_verify_unresolved_pairs.py"
      - "tools/p443_verify_unresolved_pairs.py"
      - "tools/p444_build_uncovered_repeat_pair_matrix.py"
      - "test_p444_build_uncovered_repeat_pair_matrix.py"
      - "reference/P443_AUTHENTICATED_HOLIDAY_EVIDENCE_2015_2026.csv"
      - "test_p443_recorded_closure_row_hold.py"
      - "test_p443_equity_first_repeat_review.py"
      - "p443_content_audit.py"
      - "test_p443_content_audit.py"
      - "test_p443_scanner_quarantine.py"
      - "test_p443_cross_repository.py"
      - "scanner_inputs/prepare_scanner_inputs.py"
      - "test_global_duplicate_audit_inventory.py"
      - "test_global_duplicate_audit_scan.py"
      - ".github/workflows/p443-global-integrity-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-integrity-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pinned global data-file inventory
        run: python -m unittest test_global_duplicate_audit_inventory -v
      - name: Run read-only duplicate and integrity scan
        run: python tools/audit_global_data_integrity.py --write
      - name: Validate scan outputs
        run: python -m unittest test_global_duplicate_audit_scan -v
      - name: Strict content audit regression tests
        if: ${{ !cancelled() }}
        run: python -m unittest test_p443_content_audit -v
      - name: Scanner quarantine regression tests
        run: python -m unittest test_p443_scanner_quarantine -v
      - name: Checkout pinned public scanner backend
        uses: actions/checkout@v4
        with:
          repository: jaljala044/nepse-elite-ai-scanner-pro
          ref: e5790632d293a477cc930a25649f39f8829cbf05
          path: scanner-backend
          persist-credentials: false
      - name: Verify scanner backend revision and contract
        run: |
          test "$(git -C scanner-backend rev-parse HEAD)" = e5790632d293a477cc930a25649f39f8829cbf05
          python -m unittest test_p443_cross_repository -v
      - name: Install document audit parsers
        run: python -m pip install pypdf PyYAML
      - name: Run strict pinned-byte cross-check
        if: ${{ !cancelled() }}
        run: python p443_content_audit.py --output audit-strict
      - name: Reconcile strict OHLCV findings with historical exception registers
        shell: bash
        run: |
          set -o pipefail
          (cd audit-strict && python -m zipfile -c ../p443-join-input.zip findings.jsonl)
          python tools/p443_join_ohlcv_exceptions.py p443-join-input.zip --output audit-strict/exception_join.csv | tee audit-strict/exception_join_summary.json
      - name: Classify repeated candles against pinned calendar evidence
        run: python tools/p443_classify_repeated_candles.py --input audit-strict/findings.jsonl --output audit-strict
      - name: Export disjoint repeat review queues
        run: python tools/p443_export_repeat_review_queues.py --directory audit-strict
      - name: Verify recorded closure row hold regression tests
        run: python -m unittest test_p443_recorded_closure_row_hold -v
      - name: Export unique recorded closure row holds
        run: python tools/p443_recorded_closure_row_hold.py --directory audit-strict
      - name: Reconcile authenticated historical holiday evidence
        run: python tools/p443_reconcile_historical_holidays.py --directory audit-strict
      - name: Verify open-session pairs against official security history
        run: python tools/p443_verify_open_pairs.py --directory audit-strict
      - name: Verify equity-first repeat review regression tests
        run: python -m unittest test_p443_equity_first_repeat_review -v
      - name: Export equity-first unresolved repeat review
        run: python tools/p443_equity_first_repeat_review.py --directory audit-strict
      - name: Verify unresolved-pair official-history regression tests
        run: python -m unittest test_p443_verify_unresolved_pairs -v
      - name: Cross-check all unresolved pairs against official security history
        run: python tools/p443_verify_unresolved_pairs.py --directory audit-strict
      - name: Verify P4.44 uncovered repeat-pair matrix regression tests
        run: python -m unittest test_p444_build_uncovered_repeat_pair_matrix -v
      - name: Verify P4.44 lifecycle evidence ledger and provenance rules
        run: python -m unittest test_p444_validate_lifecycle_evidence -v
      - name: Audit P4.44 effective-dated lifecycle evidence ledger
        run: python tools/p444_validate_lifecycle_evidence.py reference/P444_EFFECTIVE_DATED_LIFECYCLE_EVIDENCE_2026-11-27.csv
      - name: Build P4.44 row-level evidence matrix for 209 uncovered symbols
        run: python tools/p444_build_uncovered_repeat_pair_matrix.py --findings audit-strict/findings.jsonl --output-dir audit-strict
      - name: Verify unique equity security-date queue regression tests
        run: python -m unittest test_p443_equity_security_date_queue -v
      - name: Export unique equity security-date recovery requests
        run: python tools/p443_equity_security_date_queue.py --directory audit-strict
      - name: Bulk equity floorsheet recovery regression tests
        run: python -m unittest test_p443_bulk_equity_floorsheet_recovery -v
      - name: Map and reconcile first bulk equity floorsheet batch
        run: python tools/p443_bulk_equity_floorsheet_recovery.py --directory audit-strict --max-dates 22
      - name: Verify observed boundary regression tests
        run: python -m unittest test_p443_observed_open_close -v
      - name: Reconcile observed opening and closing executions
        run: python tools/p443_observed_open_close.py --directory audit-strict
      - name: HF-only bulk floorsheet recovery regression tests
        run: python -m unittest test_p443_hf_bulk_equity_floorsheet_recovery -v
      - name: 2024-08-01 HF rate-precision diagnostic regression tests
        run: python -m unittest test_p443_hf_20240801_rate_precision -v
      - name: Map and reconcile first HF-only equity floorsheet batch
        run: python tools/p443_hf_bulk_equity_floorsheet_recovery.py --directory audit-strict --max-dates 22 --offset 0
      - name: Map and reconcile second HF-only equity floorsheet batch
        run: python tools/p443_hf_bulk_equity_floorsheet_recovery.py --directory audit-strict --max-dates 22 --offset 22
      - name: Map and reconcile third HF-only equity floorsheet batch
        run: python tools/p443_hf_bulk_equity_floorsheet_recovery.py --directory audit-strict --max-dates 22 --offset 44
      - name: Map and reconcile fourth HF-only equity floorsheet batch
        run: python tools/p443_hf_bulk_equity_floorsheet_recovery.py --directory audit-strict --max-dates 22 --offset 66
      - name: Diagnose 2024-08-01 HF rate-precision pattern
        run: python tools/p443_hf_20240801_rate_precision.py --input audit-strict/hf_bulk_equity_invalid_rows_batch03.csv --output audit-strict/hf_2024_08_01_rate_precision_diagnostic.json
      - name: Map secondary historical floorsheet coverage
        run: python tools/p443_secondary_bulk_coverage.py --directory audit-strict
      - name: Verify secondary contract normalization and integrity regressions
        run: python -m unittest test_p443_secondary_bulk_recovery -v
      - name: Preserve strict audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p443-strict-content-audit
          path: audit-strict/
          if-no-files-found: warn
      - name: Preserve machine-readable audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p443-global-integrity-audit
          path: |
            reference/NEPSE_GLOBAL_DUPLICATE_AUDIT_REPORT.md
            reference/NEPSE_GLOBAL_DUPLICATE_AUDIT_FINDINGS.csv
            reference/NEPSE_GLOBAL_DUPLICATE_AUDIT_SCAN_SUMMARY.csv
          if-no-files-found: error
          retention-days: 30
